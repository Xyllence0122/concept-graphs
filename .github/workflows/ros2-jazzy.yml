name: ROS 2 Jazzy build and test

on:
  push:
    paths:
      - "ros2_ws/**"
      - ".github/workflows/ros2-jazzy.yml"
  pull_request:
    paths:
      - "ros2_ws/**"
      - ".github/workflows/ros2-jazzy.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base-noble
    defaults:
      run:
        shell: bash
        working-directory: ros2_ws

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions python3-rosdep

      - name: Resolve ROS dependencies
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep init 2>/dev/null || true
          rosdep update --rosdistro jazzy
          rosdep install \
            --from-paths src --ignore-src --rosdistro jazzy -r -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install \
            --packages-select cg_depth_projection cg_object_segmentation

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test \
            --packages-select cg_depth_projection cg_object_segmentation \
            --event-handlers console_direct+
          colcon test-result --verbose
